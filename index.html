<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hey Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #ffccd5, #590d22);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      animation: popIn 1s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #fff;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      color: #ffe5ec;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 30px;
      border: none;
      outline: none;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      transition: 0.3s;
    }

    input:focus {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(255,255,255,0.6);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,77,109,0.7); }
      70% { box-shadow: 0 0 0 15px rgba(255,77,109,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,77,109,0); }
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .message {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      min-height: 1.2em;
      color: #fff;
    }

    .error { color: #ffd6e0; }
    .success { color: #caffbf; }
  </style>
</head>

<body>

  <div class="login-card">
    <h1>Hey Valentine 💖</h1>
    <p class="subtitle">
      Welcome my love…  
      Only *you* can enter this 🤍
    </p>

    <input type="text" id="nameInput" placeholder="Your name in my contact 📱">
    <input type="password" id="passInput" placeholder="Your Valentine's mobile password 🔐">

    <button class="login-btn" onclick="checkLogin()">Enter My Heart 💘</button>

    <div class="message" id="msg"></div>
  </div>

  <script>
    // 💖 YOUR REAL CREDENTIALS
    const CORRECT_NAME = "channn";
    const CORRECT_PASS = "0000";

    function checkLogin() {
      const name = document.getElementById("nameInput").value.trim();
      const pass = document.getElementById("passInput").value.trim();
      const msg = document.getElementById("msg");

      if (!name || !pass) {
        msg.textContent = "Heyy 😄 don’t skip anything…";
        msg.className = "message error";
        return;
      }

      if (name === CORRECT_NAME && pass === CORRECT_PASS) {
        msg.textContent = "Welcome my Valentine ❤️";
        msg.className = "message success";

        setTimeout(() => {
          window.location.href = "dashboard.html"; // your next page
        }, 1200);
      } else {
        msg.textContent =
          "Oops 😅 looks like you opened someone else’s wishes 💌";
        msg.className = "message error";
      }
    }
  </script>

</body>
</html>
